---
- name: Configure app server
  hosts: app
  become: true

  tasks:
    - name: Install docker
      ansible.builtin.yum:
        name: docker
        state: present
    - name: Start and Enable docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    - name: Add ec2-user
      ansible.builtin.user:
        name: ec2-user
        state: present
        groups: docker,sudo
        append: yes
