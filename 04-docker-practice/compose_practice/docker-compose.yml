services:

  # --- Service 1: API ---
  api:
    build: .          #build from Dockerfile in current folder
    container_name: compose-api
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy      #wait for mysql to be ready
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  # --- Service 2: MySQL ---
  mysql:
    image: mysql:8.0
    container_name: compose-mysql
    networks:
      - app-network
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=appdb
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  # --- Service 3: Nginx ---
  nginx:
    image: nginx:alpine
    container_name: compose_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   #ro: read-only
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
  
networks:
  app-network:
    driver: bridge
  
volumes:
  mysql-data:
